<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 330" font-family="'Open Sans', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1518a6"/>
    </marker>
  </defs>

  <rect x="14" y="14" width="1272" height="302" rx="12" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>

  <text x="36" y="44" font-size="15" font-weight="700" fill="#111">Thematic.design — token workflow</text>
  <text x="36" y="61" font-size="11" fill="#909090">one source of truth · documentation generated from it · AI builds UI from the documentation</text>

  <!-- ── top row: code path ─────────────────────────────────────────── -->
  <path d="M285,127 L285,86 L558,86" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="420" y="78" font-size="9.5" font-family="Menlo, monospace" fill="#464646" text-anchor="middle">@import globals.css</text>

  <rect x="560" y="60" width="210" height="52" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="665" y="82" font-size="11.5" font-weight="700" fill="#111" text-anchor="middle">Storybook · Next.js app</text>
  <text x="665" y="99" font-size="9.5" font-family="Menlo, monospace" fill="#909090" text-anchor="middle">components/ui — var(--…) only</text>

  <path d="M770,86 L1078,86" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="924" y="78" font-size="9.5" font-family="Menlo, monospace" fill="#464646" text-anchor="middle">git push</text>

  <rect x="1080" y="60" width="180" height="52" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1170" y="82" font-size="11" font-weight="700" fill="#111" text-anchor="middle">Vercel — live docs</text>
  <text x="1170" y="99" font-size="9.5" fill="#909090" text-anchor="middle">auto-deploy on push to main</text>

  <!-- ── actor ──────────────────────────────────────────────────────── -->
  <circle cx="80" cy="175" r="11" fill="none" stroke="#111" stroke-width="1.6"/>
  <line x1="80" y1="186" x2="80" y2="222" stroke="#111" stroke-width="1.6"/>
  <line x1="60" y1="200" x2="100" y2="200" stroke="#111" stroke-width="1.6"/>
  <line x1="80" y1="222" x2="66" y2="246" stroke="#111" stroke-width="1.6"/>
  <line x1="80" y1="222" x2="94" y2="246" stroke="#111" stroke-width="1.6"/>
  <text x="80" y="266" font-size="10.5" font-weight="600" fill="#111" text-anchor="middle">Designer · Engineer</text>

  <path d="M114,208 L198,208" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="156" y="200" font-size="9.5" fill="#464646" text-anchor="middle">edit</text>

  <!-- ── source of truth ────────────────────────────────────────────── -->
  <path d="M200,140 L200,216 A85,13 0 0 0 370,216 L370,140" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <ellipse cx="285" cy="140" rx="85" ry="13" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="285" y="176" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">tokens.css</text>
  <text x="285" y="192" font-size="9.5" fill="#909090" text-anchor="middle">source of truth · 1,607 tokens</text>

  <!-- ── gate ───────────────────────────────────────────────────────── -->
  <path d="M370,178 L428,178" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="430" y="142" width="168" height="72" rx="6" fill="#f8f8ff" stroke="#1518a6" stroke-width="1.8"/>
  <text x="514" y="164" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#1518a6" text-anchor="middle">npm run verify</text>
  <text x="514" y="181" font-size="9.5" fill="#464646" text-anchor="middle">token audit — 0 errors</text>
  <text x="514" y="195" font-size="9.5" fill="#464646" text-anchor="middle">generated files fresh</text>

  <path d="M598,178 L648,178" fill="none" stroke="#1518a6" stroke-width="1.4" marker-end="url(#arrb)"/>

  <!-- ── generator ──────────────────────────────────────────────────── -->
  <rect x="650" y="148" width="170" height="60" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="735" y="172" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">design-index.cjs</text>
  <text x="735" y="189" font-size="9" fill="#909090" text-anchor="middle">reads component .mdx + source</text>

  <path d="M820,178 L878,178" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ── generated index ────────────────────────────────────────────── -->
  <rect x="880" y="148" width="180" height="60" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="970" y="172" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">DESIGN.generated.md</text>
  <text x="970" y="189" font-size="9" fill="#909090" text-anchor="middle">54 components · tokens · a11y</text>

  <path d="M1060,178 L1108,178" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1084" y="170" font-size="9" fill="#464646" text-anchor="middle">reads</text>

  <!-- ── AI assistant ───────────────────────────────────────────────── -->
  <rect x="1110" y="148" width="166" height="60" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1193" y="172" font-size="11" font-weight="700" fill="#111" text-anchor="middle">AI assistant</text>
  <text x="1193" y="189" font-size="9" fill="#909090" text-anchor="middle">CLAUDE.md sets the rules</text>

  <!-- loop: AI generates UI back into the app -->
  <path d="M1193,148 L1193,126 L680,126 L680,114" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="940" y="140" font-size="9.5" fill="#464646" text-anchor="middle">generates UI from system components + tokens</text>

  <text x="36" y="300" font-size="10.5" fill="#909090">The loop: humans and AI edit one source, the gate keeps it honest, the index is regenerated from it, and the AI builds new UI from the index — which lands back in the app.</text>
</svg>
