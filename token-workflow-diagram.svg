<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" font-family="'Open Sans', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1518a6"/>
    </marker>
  </defs>

  <!-- frame -->
  <rect x="14" y="14" width="1372" height="392" rx="12" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>

  <!-- title -->
  <text x="40" y="48" font-size="15" font-weight="700" fill="#111">Thematic.design — token workflow</text>
  <text x="40" y="66" font-size="11" fill="#909090">one hand-maintained source, everything downstream generated and gated</text>

  <!-- ── top row: code consumes the source directly ─────────────────── -->
  <path d="M310,120 L310,88 L688,88" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="470" y="80" font-size="9.5" font-family="Menlo, monospace" fill="#464646" text-anchor="middle">@import globals.css</text>

  <rect x="690" y="62" width="210" height="52" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="795" y="84" font-size="11.5" font-weight="700" fill="#111" text-anchor="middle">Storybook · Next.js app</text>
  <text x="795" y="101" font-size="9.5" font-family="Menlo, monospace" fill="#909090" text-anchor="middle">components/ui — var(--…) only</text>

  <path d="M900,88 L1178,88" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1039" y="80" font-size="9.5" font-family="Menlo, monospace" fill="#464646" text-anchor="middle">git push</text>

  <rect x="1180" y="62" width="180" height="52" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1270" y="84" font-size="11" font-weight="700" fill="#111" text-anchor="middle">Vercel — live docs</text>
  <text x="1270" y="101" font-size="9.5" fill="#909090" text-anchor="middle">auto-deploy on push to main</text>

  <!-- ── actor ──────────────────────────────────────────────────────── -->
  <circle cx="90" cy="180" r="11" fill="none" stroke="#111" stroke-width="1.6"/>
  <line x1="90" y1="191" x2="90" y2="228" stroke="#111" stroke-width="1.6"/>
  <line x1="70" y1="205" x2="110" y2="205" stroke="#111" stroke-width="1.6"/>
  <line x1="90" y1="228" x2="74" y2="252" stroke="#111" stroke-width="1.6"/>
  <line x1="90" y1="228" x2="106" y2="252" stroke="#111" stroke-width="1.6"/>
  <text x="90" y="272" font-size="10.5" font-weight="600" fill="#111" text-anchor="middle">Designer · Engineer</text>
  <text x="90" y="286" font-size="9.5" fill="#909090" text-anchor="middle">+ AI assistant (CLAUDE.md)</text>

  <path d="M124,214 L223,214" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="172" y="206" font-size="9.5" fill="#464646" text-anchor="middle">edit</text>

  <!-- ── source of truth (cylinder) ─────────────────────────────────── -->
  <path d="M225,142 L225,214 A85,13 0 0 0 395,214 L395,142" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <ellipse cx="310" cy="142" rx="85" ry="13" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="310" y="176" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">tokens.css</text>
  <text x="310" y="192" font-size="9.5" fill="#909090" text-anchor="middle">source of truth · 1,533 tokens</text>

  <rect x="225" y="248" width="170" height="46" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="310" y="268" font-size="10" font-family="Menlo, monospace" fill="#111" text-anchor="middle">token-descriptions.json</text>
  <text x="310" y="283" font-size="9" fill="#909090" text-anchor="middle">hand-written $description</text>

  <!-- ── gate ───────────────────────────────────────────────────────── -->
  <path d="M395,178 L498,178" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="500" y="146" width="168" height="72" rx="6" fill="#f8f8ff" stroke="#1518a6" stroke-width="1.8"/>
  <text x="584" y="168" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#1518a6" text-anchor="middle">npm run verify</text>
  <text x="584" y="185" font-size="9.5" fill="#464646" text-anchor="middle">token audit — 0 errors</text>
  <text x="584" y="199" font-size="9.5" fill="#464646" text-anchor="middle">generated files fresh</text>

  <path d="M668,178 L708,178" fill="none" stroke="#1518a6" stroke-width="1.4" marker-end="url(#arrb)"/>

  <!-- sidecar feeds the generators, bypassing the gate row -->
  <path d="M395,271 L740,271 L740,252" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ── generators ─────────────────────────────────────────────────── -->
  <rect x="710" y="146" width="190" height="104" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="805" y="166" font-size="11" font-weight="700" fill="#111" text-anchor="middle">Generators</text>
  <text x="805" y="184" font-size="9.5" font-family="Menlo, monospace" fill="#464646" text-anchor="middle">token-export-1.5.cjs</text>
  <text x="805" y="199" font-size="9.5" font-family="Menlo, monospace" fill="#464646" text-anchor="middle">design-index.cjs</text>
  <text x="805" y="214" font-size="9.5" font-family="Menlo, monospace" fill="#464646" text-anchor="middle">token-chain-viewer.cjs</text>
  <text x="805" y="232" font-size="9" fill="#909090" text-anchor="middle">derive, never hand-edit</text>

  <!-- ── outputs ────────────────────────────────────────────────────── -->
  <path d="M900,168 L925,168 L925,146 L948,146" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M900,198 L925,198 L925,231 L948,231" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M900,228 L918,228 L918,297 L948,297" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>

  <path d="M950,122 L950,170 A85,12 0 0 0 1120,170 L1120,122" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <ellipse cx="1035" cy="122" rx="85" ry="12" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1035" y="150" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">tokens 1.5/</text>
  <text x="1035" y="165" font-size="9" fill="#909090" text-anchor="middle">flat · DTCG · Tokens Studio</text>

  <rect x="950" y="208" width="170" height="46" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.3"/>
  <text x="1035" y="228" font-size="10" font-family="Menlo, monospace" fill="#111" text-anchor="middle">DESIGN.generated.md</text>
  <text x="1035" y="243" font-size="9" fill="#909090" text-anchor="middle">54-component index</text>

  <rect x="950" y="274" width="170" height="46" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.3"/>
  <text x="1035" y="294" font-size="10" font-family="Menlo, monospace" fill="#111" text-anchor="middle">token-chains.html</text>
  <text x="1035" y="309" font-size="9" fill="#909090" text-anchor="middle">visual chain explorer</text>

  <!-- ── consumers ──────────────────────────────────────────────────── -->
  <path d="M1120,146 L1178,146" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1149" y="139" font-size="8.5" fill="#464646" text-anchor="middle">sync</text>

  <rect x="1180" y="122" width="180" height="48" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1270" y="142" font-size="11" font-weight="700" fill="#111" text-anchor="middle">Figma variables</text>
  <text x="1270" y="158" font-size="9" fill="#909090" text-anchor="middle">push-to-figma.py · $description</text>

  <path d="M1120,231 L1178,231" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="1180" y="208" width="180" height="46" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1270" y="228" font-size="11" font-weight="700" fill="#111" text-anchor="middle">AI assistants</text>
  <text x="1270" y="243" font-size="9" fill="#909090" text-anchor="middle">retrieve before generating UI</text>

  <path d="M1120,297 L1178,297" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="1180" y="274" width="180" height="46" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1270" y="294" font-size="11" font-weight="700" fill="#111" text-anchor="middle">Docs · portfolio</text>
  <text x="1270" y="309" font-size="9" fill="#909090" text-anchor="middle">single shareable file</text>

  <!-- legend -->
  <text x="40" y="388" font-size="10.5" fill="#909090">Every arrow is a script or import in the repo — nothing is synced by hand. The gate fails the commit if the audit finds an error or any generated file is stale.</text>
</svg>
