<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" font-family="'Open Sans', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1518a6"/>
    </marker>
  </defs>

  <rect x="14" y="14" width="1372" height="402" rx="12" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.5"/>

  <text x="36" y="46" font-size="15" font-weight="700" fill="#111">Thematic.design — building a page with AI</text>
  <text x="36" y="63" font-size="11" fill="#909090">you prompt content · the AI retrieves the system · components carry the tokens · the gate proves it before anything ships</text>

  <!-- ── docs the AI retrieves (top row) ────────────────────────────── -->
  <rect x="330" y="86" width="190" height="54" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
  <text x="425" y="106" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">DESIGN.generated.md</text>
  <text x="425" y="121" font-size="9" fill="#909090" text-anchor="middle">pick components — intent · avoid</text>
  <text x="343" y="80" font-size="9.5" font-weight="700" fill="#1518a6">2 · choose</text>

  <path d="M520,113 L568,113" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="570" y="86" width="200" height="54" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
  <text x="670" y="106" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">&lt;Component&gt;.mdx</text>
  <text x="670" y="121" font-size="9" fill="#909090" text-anchor="middle">the contract — states · a11y · composition</text>
  <text x="583" y="80" font-size="9.5" font-weight="700" fill="#1518a6">3 · read the spec</text>

  <!-- AI reads up into the docs, spec flows down into the build -->
  <path d="M290,168 L290,113 L328,113" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="255" y="140" font-size="9" fill="#464646">reads</text>
  <path d="M670,142 L670,196 L718,196" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ── actor ──────────────────────────────────────────────────────── -->
  <circle cx="80" cy="182" r="11" fill="none" stroke="#111" stroke-width="1.6"/>
  <line x1="80" y1="193" x2="80" y2="229" stroke="#111" stroke-width="1.6"/>
  <line x1="60" y1="207" x2="100" y2="207" stroke="#111" stroke-width="1.6"/>
  <line x1="80" y1="229" x2="66" y2="253" stroke="#111" stroke-width="1.6"/>
  <line x1="80" y1="229" x2="94" y2="253" stroke="#111" stroke-width="1.6"/>
  <text x="80" y="273" font-size="10.5" font-weight="600" fill="#111" text-anchor="middle">You</text>

  <path d="M114,215 L168,215" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="108" y="203" font-size="9.5" font-weight="700" fill="#1518a6">1 · prompt</text>
  <text x="80" y="289" font-size="8.5" fill="#909090" text-anchor="middle">page · requirements</text>
  <text x="80" y="300" font-size="8.5" fill="#909090" text-anchor="middle">placeholders</text>

  <!-- ── AI assistant ───────────────────────────────────────────────── -->
  <rect x="170" y="170" width="180" height="88" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="260" y="194" font-size="11.5" font-weight="700" fill="#111" text-anchor="middle">AI assistant</text>
  <text x="260" y="212" font-size="9" fill="#909090" text-anchor="middle">CLAUDE.md auto-loads:</text>
  <text x="260" y="225" font-size="9" fill="#909090" text-anchor="middle">tokens only · compose, don't invent</text>
  <text x="260" y="238" font-size="9" fill="#909090" text-anchor="middle">honour the a11y contract</text>

  <path d="M350,214 L718,214" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="465" y="206" font-size="9.5" font-weight="700" fill="#1518a6">4 · build</text>
  <text x="540" y="232" font-size="8.5" fill="#909090" text-anchor="middle">no hex · no new primitives · placeholders become props</text>

  <!-- ── the page ───────────────────────────────────────────────────── -->
  <rect x="720" y="174" width="212" height="66" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="826" y="198" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">app/dashboard/&lt;page&gt;</text>
  <text x="826" y="215" font-size="9" fill="#909090" text-anchor="middle">composed entirely from</text>
  <text x="826" y="227" font-size="9" fill="#909090" text-anchor="middle">system components</text>

  <!-- ── the system (cylinder) feeds the page ───────────────────────── -->
  <path d="M731,316 L731,376 A95,12 0 0 0 921,376 L921,316" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <ellipse cx="826" cy="316" rx="95" ry="12" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="826" y="346" font-size="10.5" font-weight="700" font-family="Menlo, monospace" fill="#111" text-anchor="middle">components/ui · tokens.css</text>
  <text x="826" y="362" font-size="9" fill="#909090" text-anchor="middle">54 components · 1,533 tokens · 3 tiers</text>

  <path d="M826,304 L826,242" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="836" y="278" font-size="8.5" fill="#464646">imports · var(--…)</text>

  <!-- ── the gate ───────────────────────────────────────────────────── -->
  <path d="M932,207 L976,207" fill="none" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="978" y="172" width="170" height="72" rx="6" fill="#f8f8ff" stroke="#1518a6" stroke-width="1.8"/>
  <text x="1063" y="194" font-size="11" font-weight="700" font-family="Menlo, monospace" fill="#1518a6" text-anchor="middle">npm run verify</text>
  <text x="1063" y="211" font-size="9.5" fill="#464646" text-anchor="middle">audit: no hardcoded values</text>
  <text x="1063" y="225" font-size="9.5" fill="#464646" text-anchor="middle">generated docs fresh</text>
  <text x="991" y="166" font-size="9.5" font-weight="700" fill="#1518a6">5 · gate</text>

  <path d="M1148,207 L1196,207" fill="none" stroke="#1518a6" stroke-width="1.4" marker-end="url(#arrb)"/>
  <text x="1172" y="199" font-size="8.5" fill="#464646" text-anchor="middle">0 errors</text>

  <!-- ── ship ───────────────────────────────────────────────────────── -->
  <rect x="1198" y="176" width="162" height="64" rx="6" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
  <text x="1279" y="199" font-size="11" font-weight="700" fill="#111" text-anchor="middle">commit · push</text>
  <text x="1279" y="216" font-size="9" fill="#909090" text-anchor="middle">Vercel auto-deploys main</text>
  <text x="1279" y="229" font-size="9" fill="#909090" text-anchor="middle">page is live</text>
  <text x="1211" y="170" font-size="9.5" font-weight="700" fill="#1518a6">6 · ship</text>

  <text x="36" y="404" font-size="10.5" fill="#909090">The AI never handles raw values: components carry their tokens in, the page only composes. If a hex or a phantom token slips through anyway, step 5 refuses the commit.</text>
</svg>
